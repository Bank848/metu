# fly.server.toml — METU API server (Express) on Fly.io.
#
# Sister config to fly.toml (which deploys the Next.js BFF as `metu`).
# Deploy with:
#   flyctl deploy --config fly.server.toml
#
# Env vars set via `flyctl secrets set -a metu-api`:
#   - DATABASE_URL              (Neon pooled, runtime)
#   - DATABASE_URL_UNPOOLED     (Neon direct, for `prisma migrate deploy`)
#   - JWT_SECRET                (32+ bytes, shared with the BFF later)
#   - CORS_ORIGIN               (https://metu.fly.dev — single origin)

app = "metu-api"
primary_region = "sin"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TZ = "Asia/Bangkok"

# Apply pending Prisma migrations BEFORE the new release becomes live.
# Same pattern as the BFF's fly.toml — keeps the schema in sync without
# a manual SSH step.
[deploy]
  release_command = "sh -c 'DATABASE_URL=\"$DATABASE_URL_UNPOOLED\" node node_modules/prisma/build/index.js migrate deploy --schema=packages/db/prisma/schema.prisma'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
