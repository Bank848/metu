# fly.toml app configuration file generated for metu on 2026-06-18T06:22:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'metu'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = "sh -c 'set -e; export DATABASE_URL=\"$DATABASE_URL_UNPOOLED\"; node node_modules/prisma/build/index.js migrate resolve --applied 20260511160000_add_gifting_enabled --schema=packages/db/prisma/schema.prisma 2>/dev/null || true; node node_modules/prisma/build/index.js migrate resolve --applied 20260511180000_add_user_level_view --schema=packages/db/prisma/schema.prisma 2>/dev/null || true; node node_modules/prisma/build/index.js migrate resolve --applied 20260512090000_widen_order_item_delivered_key --schema=packages/db/prisma/schema.prisma 2>/dev/null || true; node node_modules/prisma/build/index.js migrate deploy --schema=packages/db/prisma/schema.prisma'"

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  TZ = 'Asia/Bangkok'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
