# DEV-ONLY local Postgres + Adminer. Production uses Neon, never this.
# Credentials below are placeholders; ports bind to 127.0.0.1 only.
services:
  db:
    image: postgres:16-alpine
    container_name: metu-db
    restart: unless-stopped
    environment:
      # Dev-only placeholder credential. Production uses Neon and a
      # rotated DATABASE_URL stored in Fly secrets — never this value.
      POSTGRES_USER: metu
      POSTGRES_PASSWORD: metu
      POSTGRES_DB: metu
    ports:
      # Loopback-only bind — `127.0.0.1:` prefix prevents Docker from
      # publishing this port on 0.0.0.0 (the default behaviour) where
      # any host on the local network could reach a metu/metu Postgres.
      - "127.0.0.1:5432:5432"
    volumes:
      - metu-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metu -d metu"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1-standalone
    container_name: metu-adminer
    restart: unless-stopped
    ports:
      # Loopback-only bind — Adminer is a web DB admin UI shipping with
      # no auth on the listening port; only the dev's own browser at
      # http://localhost:8081 should reach it.
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    depends_on:
      db:
        condition: service_healthy

volumes:
  metu-db-data:
