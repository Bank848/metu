# fly.server.toml — METU API server (Express) on Fly.io.
#
# Sister config to fly.toml (which deploys the Next.js BFF as `metu`).
# Deploy with:
#   flyctl deploy --config fly.server.toml
#
# Env vars set via `flyctl secrets set -a metu-api`:
#   - DATABASE_URL              (Neon pooled, runtime)
#   - DATABASE_URL_UNPOOLED     (Neon direct, for `prisma migrate deploy`)
#   - JWT_SECRET                (32+ bytes, shared with the BFF later)
#   - CORS_ORIGIN               (https://metu.fly.dev — single origin)

app = "metu-api"
primary_region = "sin"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TZ = "Asia/Bangkok"

# Apply pending Prisma migrations BEFORE the new release becomes live.
# Same pattern as the BFF's fly.toml — keeps the schema in sync without
# a manual SSH step.
#
# The `migrate resolve --rolled-back` line ahead of `migrate deploy`
# clears any stuck-failed entry for our latest migration before
# retrying. Prisma transactions roll back atomically on failure, so
# the only persistent side-effect of a failed apply is the
# `_prisma_migrations` row marked as "applied=false / failed". The
# `|| true` makes resolve a no-op on a clean DB.
[deploy]
  release_command = "sh -c 'set -e; export DATABASE_URL=\"$DATABASE_URL_UNPOOLED\"; node node_modules/prisma/build/index.js migrate resolve --rolled-back 20260505220000_drop_live_partial_indexes --schema=packages/db/prisma/schema.prisma 2>/dev/null || true; node node_modules/prisma/build/index.js migrate resolve --applied 20260511160000_add_gifting_enabled --schema=packages/db/prisma/schema.prisma 2>/dev/null || true; node node_modules/prisma/build/index.js migrate resolve --applied 20260511180000_add_user_level_view --schema=packages/db/prisma/schema.prisma 2>/dev/null || true; node node_modules/prisma/build/index.js migrate resolve --applied 20260512090000_widen_order_item_delivered_key --schema=packages/db/prisma/schema.prisma 2>/dev/null || true; node node_modules/prisma/build/index.js migrate deploy --schema=packages/db/prisma/schema.prisma'"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on machine. Earlier we ran with auto_stop=stop +
  # min=0 to save Fly hours, but every cold start added 2-3s to the
  # first request after idle — directly visible in the BFF's TTFB
  # because /auth/me and the catalogue queries all wait on the API
  # boot. Defense is days away; consistency beats $1/mo of savings.
  auto_stop_machines = "off"
  auto_start_machines = true
  # Pinned to 2 for the 2026-05-12 defense window: redundancy + zero cold-start
  # during demo. Drop back to 1 after defense to halve the idle Fly bill.
  min_machines_running = 2

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
